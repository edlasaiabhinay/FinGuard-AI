services:
- type: web
  name: finguard-ai-api
  runtime: python
  plan: free
  buildCommand: pip install -r requirements-api.txt
  startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health
  envVars:
  - key: PYTHON_VERSION
    value: 3.12.8
  - key: FINGUARD_HITL_DATABASE_PATH
    value: /tmp/human_review.db
  - key: FINGUARD_CORS_ORIGINS
    value: https://YOUR-VERCEL-DOMAIN.vercel.app
  - key: FINGUARD_REVIEWER_TOKEN_HASHES
    sync: false
